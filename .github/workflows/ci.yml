name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: node dist/cli.js --help
      - run: node --input-type=module -e "const kit = await import('./dist/index.mjs'); if (typeof kit.defineDataset !== 'function') process.exit(1)"
      - run: node -e "const kit = require('./dist/index.js'); if (typeof kit.defineDataset !== 'function') process.exit(1)"
      - run: node dist/cli.js validate --file examples/make.ts
      - run: npm pack --dry-run

  templates:
    name: template ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [cpp, go, rust, java, py, js]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node dist/cli.js init --lang ${{ matrix.lang }} --force
      - run: node dist/cli.js validate --file make.ts
